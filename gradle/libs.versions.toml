# PrintDesk dependency catalogue.
# Every version here was resolved against Maven Central / Google Maven, not recalled.
# Keep this file the single source of truth — no version literals in module build files.

[versions]
# --- Build ---------------------------------------------------------------
agp = "9.3.2"
# AGP 9 is required, not preferred: Hilt's Gradle plugin refuses to apply on
# AGP 8.x ("only compatible with AGP 9.0.0 or higher") as of 2.59. Staying on
# AGP 8 would mean pinning Hilt to an old release on a brand-new app.
#
# Kotlin is pinned to 2.3.21 rather than 2.4.x because KSP has not shipped a
# 2.4-compatible release yet (latest KSP 2.3.11 builds against Kotlin 2.3.20).
# Room and Hilt both go through KSP, so Kotlin cannot lead here.
kotlin = "2.3.21"
ksp = "2.3.11"
detekt = "1.23.8"

# --- SDK levels ----------------------------------------------------------
# targetSdk 36 is mandatory: Google Play requires it for new submissions from
# 31 Aug 2026. minSdk 26 covers ~99% of active devices.
#
# compileSdk leads targetSdk by one release because AndroidX 1.19 / Compose
# 2026.08 are built against API 37 and refuse to be consumed from an older
# compileSdk. Compiling against 37 only exposes newer APIs; targetSdk 36 is
# what governs runtime behaviour, so this does not opt the app into API 37
# behaviour changes.
compileSdk = "37"
minSdk = "26"
targetSdk = "36"

# --- AndroidX / Compose --------------------------------------------------
composeBom = "2026.08.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
documentfile = "1.1.0"
room = "2.8.4"
datastore = "1.2.1"
work = "2.11.2"

# --- DI ------------------------------------------------------------------
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"

# --- Kotlin libraries ----------------------------------------------------
coroutines = "1.11.0"
serialization = "1.11.0"

# --- PDF & printing ------------------------------------------------------
# PdfBox-Android is Apache-2.0. This matters: iText and PDFTron are AGPL /
# commercial and would be incompatible with shipping this app.
pdfboxAndroid = "2.0.27.0"
# HP's IPP implementation, Apache-2.0, built for exactly this use case.
jipp = "0.7.16"

# --- Test ----------------------------------------------------------------
junit = "4.13.2"
truth = "1.4.5"
robolectric = "4.16.1"
androidxTestJunit = "1.3.0"

[libraries]
# --- Compose (versions come from the BOM) --------------------------------
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material3-windowsize = { group = "androidx.compose.material3", name = "material3-window-size-class" }

# --- AndroidX ------------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- DI ------------------------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Kotlin libraries ----------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- PDF & printing ------------------------------------------------------
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
jipp-core = { group = "com.hp.jipp", name = "jipp-core", version.ref = "jipp" }

# --- Test ----------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
