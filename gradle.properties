# JVM: 2 GB is enough for this project and keeps the daemon friendly on a laptop.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# Non-transitive R classes keep each module's resources isolated and shrink the
# final R class considerably.
android.nonTransitiveRClass=true
# R8 full mode: more aggressive optimisation and shrinking for release builds.
android.enableR8.fullMode=true

kotlin.code.style=official

# AGP 9 defaults to its new DSL, which is incompatible with the standalone
# org.jetbrains.kotlin.android plugin. Android modules therefore use AGP's
# built-in Kotlin support (android.builtInKotlin, on by default) and do not
# apply kotlin.android. Pure JVM modules still use org.jetbrains.kotlin.jvm,
# which is unaffected.
